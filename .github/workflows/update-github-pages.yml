name: Update GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate site files
        env:
          GITHUB_PAGES_URL: https://github.com/${{ github.repository }}
        run: |
          python scripts/update_site.py
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          pages_url = "${{ github.server_url }}/${{ github.repository }}"
          wiki_home = (root / 'wiki' / 'Home.md').read_text(encoding='utf-8')
          wiki_summary = (root / 'wiki' / 'Summary.md').read_text(encoding='utf-8')
          (root / 'wiki' / 'Home.md').write_text(wiki_home.replace('{GITHUB_PAGES_URL}', pages_url), encoding='utf-8')
          (root / 'wiki' / 'Summary.md').write_text(wiki_summary.replace('{GITHUB_PAGES_URL}', pages_url), encoding='utf-8')
          PY

      - name: Update GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki_repo
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp ../wiki_output/Home.md Home.md
          cp ../wiki_output/Summary.md Summary.md

          git add Home.md Summary.md

          if git diff --cached --quiet; then
            echo "Wiki is already in sync"
          else
            git commit -m "Update wiki pages"
            git push origin HEAD
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
