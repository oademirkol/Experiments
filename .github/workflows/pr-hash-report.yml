name: PR File Hash Report

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  hash-report:
    # Only run when the 'run-calc' label is added to a draft PR
    if: github.event.label.name == 'run-calc' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Check out the PR head branch so we can push the plot back to it
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install matplotlib
        run: pip install matplotlib --quiet

      - name: Compute SHA-256 hashes for all files
        run: python scripts/compute_hashes.py

      - name: Generate file-extension distribution plot
        run: python scripts/generate_plot.py

      - name: Commit plot to PR branch
        run: |
          mkdir -p .github/plots
          cp plot.png ".github/plots/pr-${{ github.event.pull_request.number }}.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/plots/pr-${{ github.event.pull_request.number }}.png"
          git diff --cached --quiet || git commit -m "chore: add hash report plot for PR #${{ github.event.pull_request.number }} [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Post hash report as PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/post_pr_comment.py

      - name: Save PR context for downstream workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/save_pr_context.py

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-report-artifacts
          path: |
            hash_report.md
            plot.png
            pr_context.json
