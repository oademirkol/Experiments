name: PR Merged Report

on:
  workflow_run:
    workflows: ["PR File Hash Report"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read  # required to download artifacts from the triggering workflow

jobs:
  merge-report:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository at triggering commit
        uses: actions/checkout@v4
        with:
          # Use the same commit as the hash-report run so scripts/ is in sync
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download report artifacts
        uses: actions/download-artifact@v4
        with:
          name: pr-report-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge report and post PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/merge_report.py
